<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription Art Oratoire</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:linear-gradient(135deg,#0f172a,#1e3a8a);margin:0;padding:15px;display:flex;justify-content:center;min-height:100vh;}
.card{background:white;max-width:480px;width:100%;border-radius:20px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,0.3);}
.badge{background:#fbbf24;color:#78350f;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:bold;display:inline-block;margin-bottom:10px;}
h2{margin:5px 0;color:#0f172a;} .sub{color:#64748b;font-size:14px;margin-bottom:22px;}
label{font-weight:600;font-size:13px;display:block;margin:14px 0 6px;}
input,select,textarea{width:100%;padding:12px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:15px;}
button{width:100%;margin-top:22px;background:#16a34a;color:white;border:none;padding:15px;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;}
</style>
</head>
<body>
<div class="card">
<span class="badge">🎤 FORMATION ART ORATOIRE</span>
<h2>Deviens un Orateur Captivant</h2>
<p class="sub">Réserve ta place maintenant - Places limitées !</p>
<form id="form">
<label>Nom et Prénoms</label><input type="text" id="nom" required placeholder="Ex: Koffi Jean">
<label>WhatsApp</label><input type="tel" id="phone" required placeholder="05 XX XX XX XX">
<label>Commune</label><select id="ville" required><option>Cocody</option><option>Yopougon</option><option>Adjamé</option><option>Plateau</option><option>Autre</option></select>
<label>Niveau</label><select id="niveau" required><option>Débutant - J'ai peur de parler</option><option>Intermédiaire</option><option>Avancé</option></select>
<button type="submit">✅ S'inscrire sur WhatsApp</button>
</form>
</div>
<script>
document.getElementById('form').addEventListener('submit', function(e){
 e.preventDefault();
 let nom=document.getElementById('nom').value;
 let phone=document.getElementById('phone').value;
 let ville=document.getElementById('ville').value;
 let niveau=document.getElementById('niveau').value;
 let numero="2250501118431";
 let text=`*🎤 NOUVELLE INSCRIPTION - ART ORATOIRE*%0A%0ANom: ${nom}%0AWhatsApp: ${phone}%0ACommune: ${ville}%0ANiveau: ${niveau}`;
 window.open(`https://wa.me/${numero}?text=${text}`,'_blank');
});
</script>
</body>
</html>
