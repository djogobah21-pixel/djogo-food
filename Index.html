<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DJOGO FOOD - Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div class="max-w-md mx-auto bg-white min-h-screen">
    
    <!-- Header -->
    <div class="bg-orange-600 text-white p-4 text-center">
      <h1 class="text-2xl font-bold">Maquis Le Rendez-vous</h1>
      <p class="text-sm">Table 5 - DJOGO FOOD</p>
    </div>

    <!-- Menu -->
    <div class="p-4">
      <h2 class="text-xl font-bold mb-3">Notre Menu</h2>
      
      <!-- Plat 1 -->
      <div class="bg-white shadow rounded-lg p-3 mb-3 flex gap-3">
        <img src="https://via.placeholder.com/80" class="w-20 h-20 rounded">
        <div class="flex-1">
          <h3 class="font-bold">Poulet Braisé + Alloco</h3>
          <p class="text-gray-600 text-sm">Avec sauce pimentée</p>
          <div class="flex justify-between items-center mt-2">
            <span class="text-orange-600 font-bold">4500 FCFA</span>
            <button class="bg-orange-600 text-white px-3 py-1 rounded">Ajouter</button>
          </div>
        </div>
      </div>

      <!-- Plat 2 -->
      <div class="bg-white shadow rounded-lg p-3 mb-3 flex gap-3">
        <img src="https://via.placeholder.com/80" class="w-20 h-20 rounded">
        <div class="flex-1">
          <h3 class="font-bold">Attiéké Poisson Braisé</h3>
          <p class="text-gray-600 text-sm">Avec alloco et piment</p>
          <div class="flex justify-between items-center mt-2">
            <span class="text-orange-600 font-bold">3500 FCFA</span>
            <button class="bg-orange-600 text-white px-3 py-1 rounded">Ajouter</button>
          </div>
        </div>
      </div>

    </div>

    <!-- Bouton Panier -->
    <div class="fixed bottom-0 left-0 right-0 bg-white p-4 shadow-lg">
      <button class="w-full bg-green-600 text-white py-3 rounded-lg font-bold">
        Voir Panier - 0 FCFA
      </button>
    </div>
  </div>
</body>
</html>
