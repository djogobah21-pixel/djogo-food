<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club Art Oratoire - Inscription</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f6f7fb;margin:0;padding:12px;color:#222}
.container{max-width:900px;margin:auto;background:white;border-radius:16px;overflow:hidden;box-shadow:0 15px 40px rgba(0,0,0,.08)}
header{background:#0f172a;color:white;padding:28px;text-align:center}
header h1{margin:0;font-size:20px}header h2{margin:6px 0;color:#fbbf24}
.slogan{font-style:italic;color:#cbd5e1;margin:8px 0} .intro{font-size:13px;color:#e2e8f0;max-width:650px;margin:10px auto 0}
form{padding:20px}section{border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:16px;background:#fcfdff}
h3{margin:0 0 10px;font-size:14px;color:#0f172a;border-left:4px solid #fbbf24;padding-left:10px;text-transform:uppercase}
label{font-size:12.5px;font-weight:700;display:block;margin-bottom:3px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .full{grid-column:1/3} .mt{margin-top:12px}
.checks,.radios{display:flex;flex-wrap:wrap;gap:7px 14px;margin-top:6px}
.checks label,.radios label{font-weight:400;font-size:12.5px;background:#f1f5f9;padding:6px 10px;border-radius:20px;display:flex;align-items:center;gap:5px}
button{width:100%;padding:14px;background:#0f172a;color:#fbbf24;border:none;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer;margin-top:10px}
button:hover{background:#000}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<header>
<h1>FORMULAIRE D'INSCRIPTION</h1>
<h2>CLUB ART ORATOIRE</h2>
<p class="slogan">« Prenez la parole. Affirmez votre leadership. »</p>
</header>

<form id="formClub">
<section><h3>1. Informations Personnelles</h3>
<div class="grid2">
<div><label>Nom *</label><input id="nom" type="text" required></div>
<div><label>Prénom(s) *</label><input id="prenom" type="text" required></div>
<div><label>Téléphone / WhatsApp *</label><input id="telephone" type="tel" placeholder="+225..." required></div>
<div><label>Email *</label><input id="email" type="email" required></div>
<div class="full"><label>Ville / Commune</label><input id="ville" type="text"></div>
<div><label>Situation</label><select id="situation"><option>Étudiant(e)</option><option>Salarié(e)</option><option>Cadre</option><option>Dirigeant(e)</option><option>Entrepreneur(e)</option><option>Autre</option></select></div>
<div><label>Formule souhaitée</label><select id="formule"><option>Découverte</option><option>Essentielle</option><option>Premium</option><option>Coaching individuel</option><option>Entreprise</option></select></div>
</div>
<div class="mt"><label>Ta principale difficulté ?</label><textarea id="defi" rows="2" placeholder="Ex: Trac, manque de confiance..."></textarea></div>
<div class="mt"><label>Ton objectif principal ?</label><textarea id="objectif" rows="2" placeholder="Ex: Devenir plus convaincant..."></textarea></div>
</section>

<section><h3>Engagement</h3>
<label><input type="checkbox" required> J’accepte les conditions d’adhésion</label>
<label style="margin-top:8px"><input type="checkbox" required> J’accepte d’être contacté(e)</label>
</section>

<button type="submit">Envoyer sur WhatsApp</button>
</form>
</div>

<script>
document.getElementById('formClub').addEventListener('submit', function(e){
  e.preventDefault();
  let nom = document.getElementById('nom').value;
  let prenom = document.getElementById('prenom').value;
  let telephone = document.getElementById('telephone').value;
  let email = document.getElementById('email').value;
  let ville = document.getElementById('ville').value;
  let situation = document.getElementById('situation').value;
  let formule = document.getElementById('formule').value;
  let defi = document.getElementById('defi').value;
  let objectif = document.getElementById('objectif').value;

  let message = `🔥 NOUVELLE INSCRIPTION - CLUB ART ORATOIRE 🔥%0A%0A👤 Nom: ${nom} ${prenom}%0A📞 Tel: ${telephone}%0A📧 Email: ${email}%0A📍 Ville: ${ville}%0A💼 Situation: ${situation}%0A🎯 Formule: ${formule}%0A%0A❌ Défi: ${defi}%0A✅ Objectif: ${objectif}`;

  let tonNumero = "2250501118431"; 
  window.open(`https://wa.me/${tonNumero}?text=${message}`, '_blank');
});
</script>

</body>
</html>
