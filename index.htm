<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Club</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>body{font-family:Arial;background:#f0f2f5;padding:10px}.card{max-width:850px;margin:auto;background:#fff;padding:20px;border-radius:12px}
input,select,textarea{width:100%;padding:10px;margin:5px 0 10px;border:1px solid #ccc;border-radius:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{width:100%;padding:15px;background:#0f172a;color:#fbbf24;border:none;border-radius:10px;font-size:16px;font-weight:bold}
@media(max-width:600px){.grid{grid-template-columns:1fr}}</style>
</head><body>
<div class="card">
<h2 style="text-align:center">CLUB ART ORATOIRE - INSCRIPTION PDF</h2>
<form id="form">
<div class="grid">
<input id="n" placeholder="Nom*" required><input id="p" placeholder="Prénoms*" required>
<input id="t" placeholder="Téléphone WhatsApp*" required><input id="e" placeholder="Email*" type="email" required>
<input id="v" placeholder="Ville"><select id="s"><option>Étudiant</option><option>Salarié</option><option>Cadre</option><option>Dirigeant</option><option>Entrepreneur</option></select>
<select id="f"><option>Découverte</option><option>Essentielle</option><option>Premium</option><option>Coaching</option></select><select id="b"><option>Budget <25k</option><option>25-50k</option><option>50-100k</option><option>+100k</option></select>
</div>
<textarea id="d" placeholder="Ta difficulté principale"></textarea>
<textarea id="o" placeholder="Ton objectif"></textarea>
<button type="submit">ENVOYER EN PDF SUR WHATSAPP 0501118431</button>
</form>
</div>
<script>
document.getElementById('form').addEventListener('submit', e=>{
 e.preventDefault();
 const {jsPDF}=window.jspdf; const doc=new jsPDF();
 doc.setFillColor(15,23,42); doc.rect(0,0,210,20,'F');
 doc.setTextColor(251,191,36); doc.text("CLUB ART ORATOIRE - FICHE D'INSCRIPTION PDF",10,13);
 doc.setTextColor(0,0,0); doc.setFontSize(11);
 let y=30;
 doc.text(`Nom: ${n.value} ${p.value}`,10,y); y+=8;
 doc.text(`Tel: ${t.value} | Email: ${e.value} | Ville: ${v.value}`,10,y); y+=8;
 doc.text(`Situation: ${s.value} | Formule: ${f.value} | Budget: ${b.value}`,10,y); y+=12;
 doc.text("Difficulte:",10,y); y+=6; doc.text(doc.splitTextToSize(d.value,180),10,y); y+=20;
 doc.text("Objectif:",10,y); y+=6; doc.text(doc.splitTextToSize(o.value,180),10,y);
 doc.save(`INSCRIPTION_${n.value}_${p.value}.pdf`);
 setTimeout(()=>{window.location.href=`https://wa.me/2250501118431?text=Bonjour, PDF genere pour ${n.value} ${p.value}. Je vous envoie le fichier PDF telecharge en piece jointe.`},1000);
});
</script>
</body></html>
